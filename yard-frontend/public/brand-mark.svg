<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1E3C"/>
      <stop offset="1" stop-color="#06112A"/>
    </linearGradient>
    <linearGradient id="mk" x1="18" y1="7" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE9F2"/>
      <stop offset=".38" stop-color="#A4C0D6"/>
      <stop offset="1" stop-color="#3A6689"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="36" height="36" rx="9" fill="url(#bg)"/>
